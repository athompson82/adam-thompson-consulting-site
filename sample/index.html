<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Check-In | Sample Scenario | Adam Thompson Consulting</title>
<meta name="description" content="An original branching scenario: give feedback to a teammate on a simulated video call, with a voiced AI-generated character and live coaching.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A4A;--navy-2:#123E6B;--ink:#081F38;--grey:#5E6873;--line:#DDE2E7;--orange:#F07A1A;--orange-ink:#B8530A;--bg:#F4F6F8;--good:#1F7A4D;--good-bg:#E8F5EE;--mid:#8A5A00;--mid-bg:#FFF4DE;--bad:#A3352B;--bad-bg:#FBEAE8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.top a{text-decoration:none;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.top svg{width:30px;height:23px}
.top .lab{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-ink);margin:0 0 10px}
h1,h2,h3{line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,46px);font-weight:800}
h2{font-size:clamp(21px,3vw,25px);font-weight:800}
p{margin:0 0 12px}
.muted{color:var(--grey)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;padding:13px 22px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:var(--navy);color:#fff}
.btn.orange{background:var(--orange);color:var(--ink)}
.btn.orange:hover{background:#FF8F3A}

/* Intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px}
.learn{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:10px}
.learn li{display:flex;gap:12px;align-items:flex-start}
.learn li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:8px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin:0 0 20px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--navy)}
.preview{background:var(--ink);border-radius:20px;display:grid;place-items:center;padding:28px;min-height:320px;position:relative;overflow:hidden}
.preview .ptag{position:absolute;top:16px;left:16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#B8C2CC;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:6px}
@media (max-width:860px){.intro{grid-template-columns:1fr}.card{padding:24px}.preview{min-height:240px}}

/* Meeting */
.stage{display:grid;grid-template-columns:1.25fr .95fr;gap:20px;align-items:start}
@media (max-width:960px){.stage{grid-template-columns:1fr}}
.meet{background:var(--ink);border-radius:20px;overflow:hidden;color:#fff;box-shadow:0 10px 30px rgba(11,42,74,.18)}
.mbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:14px;color:#B8C2CC;border-bottom:1px solid rgba(255,255,255,.08)}
.mbar b{color:#fff;font-weight:700}
.rec{display:inline-flex;align-items:center;gap:8px}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#E5484D}
.tiles{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 90% at 50% 20%,#1A4675 0%,#0E2E52 55%,#0A2440 100%)}
.tiles .main{position:absolute;inset:0;display:grid;place-items:center}
.tiles .main svg{width:min(62%,380px);height:auto}
.name{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}

.speaking .ring{opacity:1}
.ring{position:absolute;inset:6px;border:3px solid #3DD68C;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.self{position:absolute;right:14px;top:14px;width:22%;aspect-ratio:4/3;border-radius:10px;background:#28537F;display:grid;place-items:center;font-weight:800;font-size:clamp(14px,2vw,20px);border:2px solid rgba(255,255,255,.15)}
.self small{position:absolute;bottom:5px;left:7px;font-size:11px;font-weight:600;opacity:.85}
.caption{min-height:84px;padding:14px 20px;background:#06192D;font-size:clamp(15px,1.8vw,17px);line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.caption .who{flex:none;font-weight:800;color:#FFB37A}
.controls{display:flex;justify-content:center;gap:12px;padding:12px;background:#06192D;border-top:1px solid rgba(255,255,255,.06)}
.controls span{width:42px;height:42px;border-radius:50%;background:#1C3B5E;display:grid;place-items:center}
.controls span.end{background:#C8333A;width:58px;border-radius:21px}
.controls svg{width:20px;height:20px}
.replay{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:#B8C2CC;margin-left:auto;flex:none;padding:2px 6px;border-radius:6px}
.replay:hover{color:#fff}

.tiles .main video,.tiles .main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wave{display:none;gap:2px;align-items:flex-end;height:12px}
.speaking .wave{display:inline-flex}
.wave i{width:3px;background:#3DD68C;border-radius:2px;animation:wv .5s infinite alternate}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}
@keyframes wv{from{height:3px}to{height:12px}}
.mute{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:8px}
.mute:hover{background:rgba(255,255,255,.18)}
.mute:focus-visible{outline:3px solid #F07A1A;outline-offset:2px}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Avatar animation */
.av .eyes{animation:blink 4.5s infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.av .mouth-talk{display:none}
.talking .av .mouth-talk{display:block;animation:talk .22s infinite alternate;transform-box:fill-box;transform-origin:50% 30%}
.talking .av .mouth-still{display:none}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.av .brow{transition:transform .35s;transform-box:fill-box;transform-origin:50% 50%}
.mood-defensive .av .brow.l{transform:translateY(3px) rotate(14deg)}
.mood-defensive .av .brow.r{transform:translateY(3px) rotate(-14deg)}
.mood-open .av .brow.l{transform:translateY(-3px) rotate(-6deg)}
.mood-open .av .brow.r{transform:translateY(-3px) rotate(6deg)}
.mood-guarded .av .brow.l,.mood-guarded .av .brow.r{transform:translateY(2px)}
.av .smile,.av .frown,.av .flat{display:none}
.mood-open .av .smile,.mood-neutral .av .flat,.mood-guarded .av .flat,.mood-defensive .av .frown{display:block}
@media (prefers-reduced-motion:reduce){.av .eyes,.talking .av .mouth-talk{animation:none}}

/* Panel */
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.meter{margin:0 0 18px}
.meter .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#F5A35C);border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--navy)}.steps span.now{background:var(--orange)}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.45;background:#fff;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--navy)}
.choice:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.choice .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px}
.choice[disabled]{cursor:default}
.choice.picked{border-color:var(--navy);background:#F7F9FB}
.choice.faded{opacity:.45}
.coach{display:none;margin-top:16px;border-radius:16px;padding:16px 18px;gap:12px;align-items:flex-start}
.coach.show{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.coach.good{background:var(--good-bg)}.coach.mid{background:var(--mid-bg)}.coach.bad{background:var(--bad-bg)}
.coach .cav{flex:none;width:40px;height:40px;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-weight:800}
.coach .v{font-weight:800}
.coach.good .v{color:var(--good)}.coach.mid .v{color:var(--mid)}.coach.bad .v{color:var(--bad)}
.coach p{margin:2px 0 0;font-size:15.5px}
.wait{font-size:14px;color:var(--grey);margin-top:12px;display:none}
.wait.show{display:block}

/* Results */
.res{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.res{grid-template-columns:1fr}}
.score{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.score strong{font-size:58px;line-height:1;font-weight:800}
.recap{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.recap li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15.5px}
.dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px}
.dot.good{background:var(--good)}.dot.mid{background:#D99A1C}.dot.bad{background:var(--bad)}
.model{display:grid;gap:12px;margin:14px 0 18px}
.model div{display:flex;gap:14px;align-items:flex-start}
.model b{flex:none;width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px}
.foot{margin-top:24px;font-size:14px;color:var(--grey);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a href="/"><svg viewBox="0 18 120 92" aria-hidden="true"><path fill="#0B2A4A" d="M14 104 C6 104 4 96 8 90 C12 84 22 80 40 79 C60 78 86 78 100 81 C112 84 116 92 112 99 C109 104 102 104 96 104 Z"/><path fill="#7A8590" d="M30 72 C22 72 21 64 26 59 C31 54 42 52 58 52 C74 52 90 54 94 60 C98 66 94 72 86 72 Z"/><path fill="#F07A1A" d="M39 47 C30 47 30 38 35 33 C41 26 53 23 65 23 C79 23 90 27 91 35 C92 43 87 47 79 47 Z"/></svg>← Back to site</a>
  <span class="lab">Sample scenario</span>
</div></div>

<main id="app"></main>
<p class="foot">An original sample by Adam Thompson Consulting. All people and situations are fictional.</p>
<div class="sr" aria-live="polite" id="live"></div>


<script>
// ---------- Script ----------
const PEOPLE = { j: 'Jordan', m: 'Maya (coach)' };
const S = {
  opener: { say: "Hey, thanks for making time. What did you want to talk about?", a: '01' },
  d1: {
    title: 'Decision 1 of 3 · Open the conversation',
    prompt: 'Jordan has missed the last two report deadlines, and a client noticed. How do you start?',
    opts: [
      { t: '"The last two reports came in a few days late, and the client noticed. Can you walk me through what happened?"', s: 2, trust: 15, mood: 'open', a: '02',
        say: "Yeah… honestly, I've been buried. I'm covering two accounts since Sam left, and I didn't want to make a fuss.",
        coach: 'Specific and curious. You named the situation, the behaviour and the impact, then asked an open question. That makes it safe for Jordan to tell you what’s really going on.' },
      { t: '"Nothing big, just checking in. Everything going okay?"', s: 1, trust: 0, mood: 'neutral', a: '03',
        say: "Yeah, all good! Busy, but fine.",
        coach: 'Friendly, but the real issue stays hidden. Being vague feels kind in the moment, but Jordan has no idea there’s a problem to solve.' },
      { t: '"You’ve missed two deadlines now. This can’t keep happening."', s: 0, trust: -20, mood: 'defensive', a: '04',
        say: "That's not really fair. I've been covering two accounts since Sam left, and nobody seems to have noticed.",
        coach: 'Clear, but it lands as a verdict. Leading with judgement puts people on the defensive, so you get excuses instead of solutions.' }
    ]
  },
  bridgeA: { open: '05', neutral: '06', defensive: '07' },
  bridge: {
    open: "So that's where things are. I know the deadlines slipped.",
    neutral: "Oh… the reports. Right. Honestly, I'm covering two accounts since Sam left. I didn't think anyone would notice a few days.",
    defensive: "Anyway. What do you want me to do about it?"
  },
  bridgeYou: { neutral: 'You raise the late reports more directly.' },
  d2: {
    title: 'Decision 2 of 3 · Respond to what you’ve heard',
    prompt: 'Jordan is covering two accounts. What do you say next?',
    opts: [
      { t: '"That’s a lot to carry. Let’s look at your priorities together and figure out what has to come first."', s: 2, trust: 20, mood: 'open', a: '08',
        say: "That would really help. Honestly, I've been treating everything as urgent, so nothing gets finished on time.",
        coach: 'You acknowledged the pressure without excusing the missed dates, and offered support while keeping the work with Jordan.' },
      { t: '"Why didn’t you tell me sooner?"', s: 1, trust: -5, mood: 'guarded', a: '09',
        say: "I guess I didn't want to look like I couldn't handle it.",
        coach: 'A fair question, and you got useful information, but it can sound like blame. "What would have made it easier to raise this?" gets the same answer more gently.' },
      { t: '"We’ve all got a lot on. The deadlines still need to be met."', s: 0, trust: -15, mood: 'defensive', a: '10',
        say: "Sure. I'll just work later, I guess.",
        coach: 'True, but it shuts the conversation down. Jordan leaves with more pressure and no plan, so the deadlines are likely to slip again.' }
    ]
  },
  d3: {
    title: 'Decision 3 of 3 · Agree on next steps',
    prompt: 'How do you wrap up the conversation?',
    opts: [
      { t: '"Let’s agree: client reports come first, you flag any risk two days before a deadline, and we check in Friday to see how it’s going."', s: 2, trust: 20, mood: 'open', a: '11',
        say: "Deal. That's really clear. Thanks for actually listening.",
        coach: 'Specific, shared and time-bound. Jordan owns the work, you’ve offered support, and there’s a check-in to keep it on track.' },
      { t: '"Send me a plan by end of day and we’ll go from there."', s: 1, trust: 0, mood: 'neutral', a: '12',
        say: "Okay. I'll put something together.",
        coach: 'It builds ownership, but leaves Jordan to sort out the priorities alone. Agree on the first steps together before you hang up.' },
      { t: '"Okay, so just try to stay on top of the dates going forward."', s: 0, trust: -10, mood: 'guarded', a: '13',
        say: "Yep. Will do.",
        coach: '"Try harder" isn’t a plan. Without a specific change, the same thing is very likely to happen again next month.' }
    ]
  }
};

// ---------- State & helpers ----------
const app = document.getElementById('app'), live = document.getElementById('live');
let st = { trust: 50, picks: [], mood: 'neutral', voice: true, step: 0 };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = v => Math.max(0, Math.min(100, v));

let audio = null;
function speak(text, id) {
  const tiles = document.querySelector('.tiles');
  const cap = document.getElementById('cap');
  if (cap) cap.innerHTML = `<span class="who">Jordan:</span><span>${text}</span>`;
  live.textContent = 'Jordan says: ' + text;
  if (tiles) tiles.classList.add('speaking');
  const done = () => tiles && tiles.classList.remove('speaking');
  const fallback = Math.min(6000, 900 + text.length * 45);
  if (id) {
    return new Promise(res => {
      let finished = false;
      const jt = document.getElementById('jt');
      const end = () => { if (finished) return; finished = true; if (jt) { jt.pause(); jt.style.opacity = 0; } done(); res(); };
      const viaAudio = () => {
        if (!st.voice) return setTimeout(end, fallback);
        try { if (audio) audio.pause(); audio = new Audio('media/' + id + '.mp3'); audio.onended = end;
          audio.onerror = () => setTimeout(end, fallback); audio.play().catch(() => setTimeout(end, fallback)); } catch (e) { setTimeout(end, fallback); }
      };
      setTimeout(end, 15000);
      if (!jt) return viaAudio();
      if (audio) audio.pause();
      jt.muted = !st.voice;
      jt.onended = end;
      jt.onerror = () => { jt.style.opacity = 0; viaAudio(); };
      jt.src = 'media/talk/' + id + '.mp4';
      jt.onplaying = () => { jt.style.opacity = 1; };
      jt.play().catch(() => {
        // Autoplay with sound blocked: play the clip muted with the separate audio track instead.
        jt.muted = true; jt.play().then(() => { if (st.voice) { audio = new Audio('media/' + id + '.mp3'); audio.play().catch(()=>{}); } }).catch(() => { jt.style.opacity = 0; viaAudio(); });
      });
    });
  }
  return wait(reduce ? 400 : fallback).then(done);
}
function muteLabel() { return st.voice ? '\u{1F50A} Sound on' : '\u{1F507} Sound off'; }
function toggleVoice() {
  st.voice = !st.voice;
  if (!st.voice && audio) audio.pause();
  const jt = document.getElementById('jt'); if (jt) jt.muted = !st.voice;
  const b = document.getElementById('mute'); if (b) { b.textContent = muteLabel(); b.setAttribute('aria-pressed', String(!st.voice)); }
}

function setMood(m) { st.mood = m; const t = document.querySelector('.tiles'); if (t) t.className = 'tiles mood-' + m; }
function setTrust(v) { st.trust = clamp(v); const b = document.getElementById('trust'); if (b) b.style.width = st.trust + '%'; const n = document.getElementById('trustn'); if (n) n.textContent = trustLabel(); }
function trustLabel() { return st.trust >= 75 ? 'High' : st.trust >= 50 ? 'Steady' : st.trust >= 30 ? 'Shaky' : 'Low'; }

// ---------- Screens ----------
function intro() {
  st = { trust: 50, picks: [], mood: 'neutral', voice: st.voice, step: 0 };
  app.innerHTML = `
  <div class="intro">
    <div class="card">
      <p class="eyebrow">Branching scenario · about 5 minutes</p>
      <h1>The Check-In</h1>
      <p class="muted" style="font-size:19px">Your teammate Jordan has missed two deadlines. You've booked a quick video call. How you handle the next five minutes will shape what happens next.</p>
      <ul class="learn">
        <li>Raise a problem without putting someone on the defensive</li>
        <li>Listen for what's really going on</li>
        <li>Leave with a clear, shared plan</li>
      </ul>
      <label class="toggle"><input type="checkbox" id="voice" ${st.voice ? 'checked' : ''}> Sound on. Jordan speaks, so turn your volume up.</label>
      <button class="btn" id="go">Join the call →</button>
    </div>
    <div class="preview" aria-hidden="true"><img src="media/jordan.jpg" alt=""><span class="ptag" style="z-index:1">Weekly check-in \u00b7 Jordan</span></div>
  </div>`;
  document.getElementById('go').onclick = () => { st.voice = document.getElementById('voice').checked; meeting(); };
}

function meetingShell() {
  app.innerHTML = `
  <div class="stage">
    <div class="meet">
      <div class="mbar"><span><b>Weekly check-in</b> · Jordan &amp; you</span><span style="display:flex;gap:12px;align-items:center"><button class="mute" id="mute" type="button" aria-pressed="${!st.voice}">${muteLabel()}</button><span class="rec" id="clock">00:00</span></span></div>
      <div class="tiles mood-${st.mood}">
        <div class="main"><video id="jv" src="media/jordan.mp4" poster="media/jordan.jpg" autoplay muted loop playsinline aria-label="Jordan on the video call"></video><video id="jt" playsinline preload="auto" aria-hidden="true" style="opacity:0;transition:opacity .15s"></video></div>
        <div class="ring"></div>
        <div class="name">Jordan <span class="wave" aria-hidden="true"><i></i><i></i><i></i></span></div>
        <div class="self" aria-hidden="true">You</div>
      </div>
      <div class="caption" id="cap" aria-hidden="true"><span class="who">Jordan:</span><span>…</span></div>
      <div class="controls" aria-hidden="true">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 12h3M13 12h4M7 15h7"/></svg></span>
        <span class="end"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 14c5-5 13-5 18 0l-2 3-4-1v-3a10 10 0 0 0-6 0v3l-4 1z"/></svg></span>
      </div>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </div>`;
  document.getElementById('mute').onclick = toggleVoice;
  const t0 = Date.now(); clearInterval(window._clk);
  window._clk = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); const c = document.getElementById('clock'); if (c) c.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); else clearInterval(window._clk); }, 1000);
}

function panelHead() {
  const steps = [0, 1, 2].map(i => `<span class="${i < st.step ? 'done' : i === st.step ? 'now' : ''}"></span>`).join('');
  return `<div class="steps" aria-hidden="true">${steps}</div>
    <div class="meter"><div class="row"><span>Jordan's trust</span><span id="trustn">${trustLabel()}</span></div><div class="bar" role="img" aria-label="Trust meter"><i id="trust" style="width:${st.trust}%"></i></div></div>`;
}

async function meeting() {
  meetingShell();
  const panel = document.getElementById('panel');
  panel.innerHTML = panelHead() + `<p class="muted">Connecting…</p>`;
  await wait(500);
  await speak(S.opener.say, S.opener.a);
  decision('d1');
}

function decision(key) {
  const d = S[key], panel = document.getElementById('panel');
  panel.innerHTML = panelHead() + `
    <p class="eyebrow" style="margin-bottom:6px">${d.title}</p>
    <h2>${d.prompt}</h2>
    <div class="choices" role="group" aria-label="Your options">
      ${d.opts.map((o, k) => `<button class="choice" data-k="${k}"><span class="k" aria-hidden="true">${'ABC'[k]}</span><span>${o.t}</span></button>`).join('')}
    </div>
    <p class="wait" id="wait">Jordan is responding…</p>
    <div class="coach" id="coach"></div>`;
  panel.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(key, +b.dataset.k));
  const first = panel.querySelector('.choice'); if (first) first.focus({ preventScroll: true });
}

async function choose(key, k) {
  const d = S[key], o = d.opts[k], panel = document.getElementById('panel');
  st.picks.push({ key, s: o.s });
  panel.querySelectorAll('.choice').forEach(b => { b.disabled = true; b.classList.add(+b.dataset.k === k ? 'picked' : 'faded'); });
  document.getElementById('wait').classList.add('show');
  setMood(o.mood);
  setTrust(st.trust + o.trust);
  await speak(o.say, o.a);
  document.getElementById('wait').classList.remove('show');
  const cls = o.s === 2 ? 'good' : o.s === 1 ? 'mid' : 'bad';
  const verdict = o.s === 2 ? 'Strong move' : o.s === 1 ? 'Partly there' : 'Not quite';
  const c = document.getElementById('coach');
  c.className = 'coach show ' + cls;
  const last = key === 'd3';
  c.innerHTML = `<div class="cav" aria-hidden="true">M</div><div><div class="v">${verdict}</div><p>${o.coach}</p><button class="btn" id="next" style="margin-top:12px;padding:10px 18px;font-size:15px">${last ? 'End the call →' : 'Continue →'}</button></div>`;
  const nx = document.getElementById('next'); nx.focus({ preventScroll: true });
  c.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
  nx.onclick = async () => {
    if (last) return results();
    st.step++;
    if (key === 'd1') {
      const p = document.getElementById('panel');
      p.innerHTML = panelHead() + (S.bridgeYou[st.mood] ? `<p class="muted"><em>${S.bridgeYou[st.mood]}</em></p>` : '') + `<p class="wait show">Jordan is responding…</p>`;
      if (st.mood === 'neutral') setMood('guarded');
      await speak(S.bridge[o.mood], S.bridgeA[o.mood]);
      decision('d2');
    } else decision('d3');
  };
}

function results() {
  try { if (audio) audio.pause(); } catch (e) {}
  clearInterval(window._clk);
  const total = st.picks.reduce((a, p) => a + p.s, 0);
  const head = total >= 6 ? 'That conversation landed.' : total >= 4 ? 'Solid, with room to sharpen.' : 'Jordan left feeling worse.';
  const msg = total >= 6 ? 'You raised the issue clearly, listened for the cause, and left with a plan you both own.'
    : total >= 4 ? 'You got somewhere useful. The strongest version is specific up front, curious in the middle and concrete at the end.'
    : 'The deadlines are likely to slip again. Try it once more and lead with curiosity rather than a verdict.';
  const labels = { d1: 'Opening the conversation', d2: 'Responding to what you heard', d3: 'Agreeing on next steps' };
  app.innerHTML = `
  <div class="res">
    <div class="card">
      <p class="eyebrow">Call ended · your results</p>
      <h1>${head}</h1>
      <div class="score"><strong>${total}</strong><span class="muted" style="font-weight:600">out of 6</span></div>
      <p class="muted">${msg}</p>
      <div class="meter" style="margin-top:16px"><div class="row"><span>Jordan's trust at the end</span><span>${trustLabel()}</span></div><div class="bar"><i style="width:${st.trust}%"></i></div></div>
      <ul class="recap">${st.picks.map(p => { const c = p.s === 2 ? 'good' : p.s === 1 ? 'mid' : 'bad'; return `<li><span class="dot ${c}" aria-hidden="true"></span><span><b>${labels[p.key]}:</b> ${p.s === 2 ? 'strong' : p.s === 1 ? 'partly there' : 'missed the mark'}</span></li>`; }).join('')}</ul>
    </div>
    <div class="card">
      <p class="eyebrow">What good looks like</p>
      <h2>Specific, curious, concrete</h2>
      <div class="model">
        <div><b>1</b><span><strong>Be specific.</strong> Name what happened and why it matters, not a judgement about the person.</span></div>
        <div><b>2</b><span><strong>Get curious.</strong> Ask an open question and listen for the cause before you solve anything.</span></div>
        <div><b>3</b><span><strong>Agree the next step.</strong> Who does what, by when, and when you'll check in.</span></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <button class="btn ghost" id="again">Try a different path</button>
        <a class="btn orange" href="/#contact">Build one for your team →</a>
      </div>
      <p class="muted" style="margin-top:18px;font-size:15px">Want a finance example? Try <a href="/sample/credit/">The Line of Credit Conversation</a>.</p>
    </div>
  </div>`;
  live.textContent = `${head} You scored ${total} out of 6.`;
  document.getElementById('again').onclick = intro;
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}

intro();
</script>
</body>
</html>
